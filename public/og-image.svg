<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#F5F1E8"/>
      <circle cx="1" cy="1" r="0.4" fill="#1A1814" opacity="0.045"/>
      <circle cx="3" cy="3" r="0.35" fill="#1A1814" opacity="0.035"/>
    </pattern>
    <linearGradient id="paperShade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F7F2E7"/>
      <stop offset="1" stop-color="#EFE7D4"/>
    </linearGradient>
  </defs>

  <!-- Parchment ground -->
  <rect width="1200" height="630" fill="url(#paperShade)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- Ruled frame -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#1A1814" stroke-width="1"/>
  <rect x="44" y="44" width="1112" height="542" fill="none" stroke="#1A1814" stroke-width="0.5" opacity="0.5"/>

  <!-- Masthead line -->
  <g font-family="'Newsreader','Times New Roman',serif" fill="#1A1814">
    <text x="72" y="102" font-size="14" letter-spacing="6" font-family="'Inter',sans-serif" font-weight="500" fill="#5C5142">VOLUME 01 · EDITION · FALL 2026 · CALGARY, ALBERTA</text>
  </g>
  <line x1="72" y1="118" x2="1128" y2="118" stroke="#1A1814" stroke-width="0.75"/>

  <!-- Wordmark -->
  <g font-family="'Newsreader','Times New Roman',serif" fill="#1A1814">
    <text x="72" y="196" font-size="64" font-weight="500" font-family="'Inter',sans-serif" letter-spacing="-2">Work<tspan font-family="'Newsreader',serif" font-style="italic" fill="#D9542F">Rehearsal</tspan></text>
  </g>

  <!-- Headline -->
  <g font-family="'Inter','Helvetica',sans-serif" fill="#1A1814">
    <text x="72" y="298" font-size="72" font-weight="500" letter-spacing="-2.5">Rehearse the workplace</text>
    <text x="72" y="376" font-size="72" font-weight="500" letter-spacing="-2.5">moments that <tspan font-family="'Newsreader',serif" font-style="italic" font-weight="400" fill="#D9542F">decide</tspan> your job.</text>
  </g>

  <!-- Vermilion seal -->
  <g transform="translate(1000 220) rotate(-8)">
    <circle r="112" fill="#D9542F"/>
    <circle r="112" fill="none" stroke="#1A1814" stroke-width="1.5" opacity="0.35"/>
    <circle r="96" fill="none" stroke="#F5F1E8" stroke-width="1" opacity="0.6"/>
    <text text-anchor="middle" y="42" font-size="150" font-family="'Newsreader',serif" font-style="italic" font-weight="500" fill="#F5F1E8">3</text>
    <text text-anchor="middle" y="-70" font-size="10" letter-spacing="4" font-family="'Inter',sans-serif" font-weight="500" fill="#F5F1E8">· THE 3RD ACADEMY ·</text>
    <text text-anchor="middle" y="82" font-size="10" letter-spacing="4" font-family="'Inter',sans-serif" font-weight="500" fill="#F5F1E8">EST · MMXXVI</text>
  </g>

  <!-- Ledger columns -->
  <g font-family="'Inter',sans-serif" fill="#1A1814">
    <line x1="72" y1="450" x2="1128" y2="450" stroke="#1A1814" stroke-width="0.75"/>

    <g transform="translate(72 484)">
      <text font-size="11" letter-spacing="3.5" font-weight="500" fill="#5C5142">§ PRIVACY</text>
      <text y="30" font-size="20" font-family="'Newsreader',serif" font-style="italic">Private practice</text>
    </g>

    <g transform="translate(342 484)">
      <text font-size="11" letter-spacing="3.5" font-weight="500" fill="#5C5142">§ SCORING</text>
      <text y="30" font-size="20" font-family="'Newsreader',serif" font-style="italic">No pass or fail</text>
    </g>

    <g transform="translate(612 484)">
      <text font-size="11" letter-spacing="3.5" font-weight="500" fill="#5C5142">§ DEVICE</text>
      <text y="30" font-size="20" font-family="'Newsreader',serif" font-style="italic">Mobile-first</text>
    </g>

    <g transform="translate(882 484)">
      <text font-size="11" letter-spacing="3.5" font-weight="500" fill="#5C5142">§ REFUND</text>
      <text y="30" font-size="20" font-family="'Newsreader',serif" font-style="italic">14 days</text>
    </g>

    <line x1="72" y1="540" x2="1128" y2="540" stroke="#1A1814" stroke-width="0.5" opacity="0.6"/>
    <text x="72" y="566" font-size="12" letter-spacing="2.5" fill="#5C5142">workrehearsal.com  ·  Built in Canada  ·  143 Saddlecrest Gardens NE, Calgary AB</text>
  </g>
</svg>
